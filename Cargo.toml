[package]
name = "rust-htmx-ui"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Composable Rust UI components and embedded assets for HTMX and Alpine applications"
license = "MIT"
repository = "https://github.com/marcuoli/rust-htmx-ui"
authors = ["Marcus Oliveira"]
include = ["src/**", "assets/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE.md", "docs/**", "styles/**", "scripts/**", "package.json", "package-lock.json", "runtime/**", "licenses/**"]

[dependencies]
maud = "0.27.0"
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"
